name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      debug_on_failure:
        type: boolean
        description: Open an actor-only debug session after failure
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build BoltWrt (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86-64
            target_dir: bin/targets/x86/64
          - target: cmcc-rax3000m
            target_dir: bin/targets/mediatek/filogic
    env:
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      DOWNLOAD_MIRROR: https://sources.cdn.openwrt.org
    steps:
      - name: Free runner build space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install runner build prerequisites
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget qemu-utils

      - name: Check source preparation invariants
        run: python3 -m unittest discover -s scripts/tests -p 'test_boltwrt_*.py' -v

      - name: Prepare locked feeds
        run: python3 scripts/boltwrt-prepare.py

      - name: Resolve and check product configuration
        run: python3 scripts/boltwrt-config.py '${{ matrix.target }}'

      - name: Restore source download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: dl
          key: boltwrt-dl-${{ matrix.target }}-${{ hashFiles('config/source-lock.json', 'config/version.txt', 'config/common.txt', 'config/targets/*.txt') }}

      - name: Download and verify sources
        run: make download -j6

      - name: Build firmware
        run: make -j"$(nproc)" V=s CONFIG_AUTOREMOVE=y

      - name: Check actual packages and image layouts
        run: python3 scripts/boltwrt-verify.py '${{ matrix.target }}'

      - name: Open debug session on requested manual failure
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.debug_on_failure
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        with:
          limit-access-to-actor: true

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BoltWrt-Checks_${{ matrix.target }}
          path: |
            logs/prepare-sources.json
            logs/prepare-tools/make-failures.log
            logs/boltwrt/*.json

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BoltWrt-Firmware_${{ matrix.target }}
          path: ${{ matrix.target_dir }}/boltwrt-*
          if-no-files-found: error

  release:
    name: Release Firmware
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: BoltWrt-Firmware_*
          path: firmware

      - name: Package existing firmware delivery format
        run: |
          mkdir release
          shopt -s nullglob
          for artifact_dir in firmware/BoltWrt-Firmware_*; do
            platform=${artifact_dir#firmware/BoltWrt-Firmware_}
            tar -C "$artifact_dir" -czf "release/BoltWrt_${platform}_${GITHUB_REF_NAME}.tar.gz" .
          done

      - name: Create release on an explicitly pushed version tag
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: BoltWrt ${{ github.ref_name }} Release
          files: release/*.tar.gz
