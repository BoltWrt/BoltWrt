name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      debug_on_failure:
        type: boolean
        description: Open an actor-only debug session after failure
        default: false
      cold_source_cache:
        type: boolean
        description: Prefetch all sources without restoring a cache
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build BoltWrt (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86-64
            target_dir: bin/targets/x86/64
          - target: cmcc-rax3000m
            target_dir: bin/targets/mediatek/filogic
    uses: ./.github/workflows/build-firmware-target.yml
    with:
      target: ${{ matrix.target }}
      target_dir: ${{ matrix.target_dir }}
      debug_on_failure: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_on_failure }}
      cold_source_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_source_cache }}

  release:
    name: Release Firmware
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: BoltWrt-Firmware_*
          path: firmware

      - name: Package existing firmware delivery format
        run: |
          mkdir release
          shopt -s nullglob
          for artifact_dir in firmware/BoltWrt-Firmware_*; do
            platform=${artifact_dir#firmware/BoltWrt-Firmware_}
            tar -C "$artifact_dir" -czf "release/BoltWrt_${platform}_${GITHUB_REF_NAME}.tar.gz" .
          done

      - name: Create release on an explicitly pushed version tag
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: BoltWrt ${{ github.ref_name }} Release
          files: release/*.tar.gz
