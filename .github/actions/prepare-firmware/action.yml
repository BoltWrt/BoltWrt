name: Prepare BoltWrt firmware workspace
description: Install prerequisites and resolve a locked target configuration

inputs:
  target:
    description: BoltWrt target name
    required: true

runs:
  using: composite
  steps:
    - name: Free runner build space
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        tool-cache: true
        swap-storage: false

    - name: Install runner build prerequisites
      shell: bash
      run: |
        sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget qemu-utils

    - name: Prepare locked feeds
      shell: bash
      run: python3 scripts/boltwrt-prepare.py

    - name: Resolve and check product configuration
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        python3 scripts/boltwrt-config.py "$TARGET"
        if [ "$(make -s val.DL_DIR)" != "$PWD/dl" ]; then
          echo "::error::OpenWrt download directory differs from the Artifact and cache path"
          exit 1
        fi
        {
          printf 'commit=%s\ntarget=%s\n' "$(git rev-parse HEAD)" "$TARGET"
          sha256sum config/source-lock.json .config
        } > "$RUNNER_TEMP/boltwrt-source-identity"
